version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/agrolink
      - CLIENT_URL=http://localhost
      # Payments run in clearly-labelled TEST MODE unless both Razorpay keys are provided (e.g. via backend/.env)
      - NODE_ENV=production
      - ALLOW_TEST_PAYMENTS=${ALLOW_TEST_PAYMENTS:-false}
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
